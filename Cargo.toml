[package]
name = "monkey_companion"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "A lightweight on-screen monkey companion that reacts to your mouse and keyboard."
authors = ["Mouse Monkey contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/adamburnbox-beep/mouse-monkey"
keywords = ["desktop-pet", "overlay", "wayland", "win32", "companion"]
categories = ["games"]
exclude = ["/docs", "/.github"]

[lib]
name = "monkey_companion"
path = "src/lib.rs"

[[bin]]
name = "monkey_companion"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5.11"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# Only the PNG decoder is enabled: every other format is dead weight in both
# binary size and audited dependency surface.
image = { version = "0.24", default-features = false, features = ["png"] }
log = "0.4"
rand = { version = "0.8", default-features = false, features = ["small_rng", "std", "std_rng"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12.1"
libc = "0.2"
sctk = { package = "smithay-client-toolkit", version = "0.18" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
